<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="SYNTHETIC-META-CSRF-0012">
</head>
<body>
  <a href="/logout">Esci</a>
  <!--
    The step rendered after choosing a doctor. The portal writes the units as
    JSON inside the attribute without escaping its quotes, so an HTML parser
    truncates the value: it has to be read from the source.
  -->
  <form method="POST" action="/appointments/create" id="appointment-form">
    <input type="hidden" name="_token" value="SYNTHETIC-FORM-CSRF-0012">
    <input type="hidden" name="session_id_prestazione" value="">
    <input type="hidden" name="session_name_prestazione" value="">
    <input type="hidden" id="selService" value="" />
    <input type="hidden" id="unitaEroganti" value="[{"id_unita":7001,"id_struttura":3001,"desc":"OPBG - Sede Gamma","medico":"Dr. SINTETICO UNO","prestazioni":{"9001":"VISITA SINTETICA","9002":"VISITA SINTETICA AVANZATA"}}]" />

    <div class="form-check">
      <input class="form-check-input" type="radio" name="location" id="location-all" value="location-all">
      <label for="location-all">Tutte le sedi</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="location"
             id="location-7001_3001" value="location-7001_3001">
      <label for="location-7001_3001">Sede Gamma</label>
    </div>
    <button type="submit">Continua</button>
  </form>
</body>
</html>
