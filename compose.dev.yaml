# Development overrides.
#
# Deliberately NOT named compose.override.yaml: a file with that name is loaded
# automatically, so a plain `docker compose up -d` on a server would silently
# publish MySQL and switch the application to debug logging. Development opts in
# explicitly:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# which is what the Makefile does. Here the image is built from the working tree
# and tagged locally, so it is never confused with the published one.
x-dev-image: &dev-image
  image: opbg-telegram-bot:dev
  build:
    context: .
    dockerfile: Dockerfile

x-dev-environment: &dev-environment
  APP_ENV: development
  APP_LOG_LEVEL: DEBUG

services:
  mysql:
    ports:
      # Published only in development so tests can reach the disposable server.
      - "127.0.0.1:13306:3306"

  migrate:
    <<: *dev-image

  bot:
    <<: *dev-image
    environment: *dev-environment
    read_only: false

  worker:
    <<: *dev-image
    environment: *dev-environment
    read_only: false

  backup:
    <<: *dev-image
