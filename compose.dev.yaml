# Development overrides.
#
# Deliberately NOT named compose.override.yaml: a file with that name is loaded
# automatically, so a plain `docker compose up -d` on a server would silently
# publish MySQL and switch the application to debug logging. Development opts in
# explicitly:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# which is what `make up` does.
services:
  mysql:
    ports:
      # Published only in development so tests can reach the disposable server.
      - "127.0.0.1:13306:3306"

  bot:
    environment:
      APP_ENV: development
      APP_LOG_LEVEL: DEBUG
    read_only: false

  worker:
    environment:
      APP_ENV: development
      APP_LOG_LEVEL: DEBUG
    read_only: false
