[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "opbg-telegram-bot"
version = "1.0.0"
description = "Private invite-only Telegram assistant for OPBG LAPI appointments"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Luca Tomei" }]
dependencies = [
    "aiogram==3.30.0",
    "aiomysql==0.3.2",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "orjson==3.12.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "selectolax==0.4.11",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "RET", "ARG", "PTH", "RUF",
]
# RUF001-003: Italian user-facing strings legitimately contain accented characters.
# N818: domain error names are fixed by docs/03-portal-integration.md.
# A005: docs/05-architecture.md mandates the module name `app/logging.py`.
ignore = ["RUF001", "RUF002", "RUF003", "B008", "N818", "A005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "S101", "E501"]
"alembic/*" = ["N999", "ARG001", "E501"]
# SQLAlchemy fixes the TypeDecorator hook signatures.
"app/db/types.py" = ["ARG002"]
# Protocol implementations must keep the full signature.
"app/portal/rate_limit.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "aiomysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "live: opt-in non-destructive tests against the real portal (disabled in CI)",
    "destructive: manual-only tests that mutate real portal state",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main_*.py", "alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
