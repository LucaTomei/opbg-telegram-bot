<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>{% block title %}Collega account{% endblock %} · Assistente prenotazioni</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem 1rem 3rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    background: #f4f5f7;
    color: #1b1d20;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #d8dbe0;
    border-radius: 10px;
    padding: 1.5rem;
  }
  h1 { font-size: 1.35rem; margin-top: 0; }
  h2 { font-size: 1.05rem; }
  label { display: block; font-weight: 600; margin-top: 1rem; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.7rem;
    margin-top: 0.35rem;
    border: 1px solid #b9bec7;
    border-radius: 6px;
    font-size: 1rem;
    background: #ffffff;
    color: #1b1d20;
  }
  button {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    border: 0;
    border-radius: 6px;
    background: #1f5f9e;
    color: #ffffff;
    cursor: pointer;
  }
  button:hover { background: #17497b; }
  .notice { background: #eef4fb; border-left: 4px solid #1f5f9e; padding: 0.8rem; border-radius: 4px; }
  .error { background: #fdeeee; border-left: 4px solid #b3261e; padding: 0.8rem; border-radius: 4px; }
  .success { background: #eef8f0; border-left: 4px solid #22803c; padding: 0.8rem; border-radius: 4px; }
  .muted { color: #545963; font-size: 0.9rem; }
  ul { padding-left: 1.1rem; }
  footer { max-width: 34rem; margin: 1rem auto 0; font-size: 0.8rem; color: #545963; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e8eaed; }
    main { background: #1f2227; border-color: #343841; }
    input[type="text"], input[type="email"], input[type="password"] {
      background: #16181c; color: #e8eaed; border-color: #434955;
    }
    .notice { background: #16273a; }
    .error { background: #331c1c; }
    .success { background: #16301f; }
    .muted, footer { color: #a4a9b3; }
  }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  Servizio privato e non ufficiale. Nessun dato viene condiviso con terze parti.
</footer>
</body>
</html>
