{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<p class="{{ style }}">{{ message }}</p>
{% if details %}
<ul>
  {% for item in details %}<li>{{ item }}</li>{% endfor %}
</ul>
{% endif %}
<p class="muted">Puoi chiudere questa pagina e tornare su Telegram.</p>
{% endblock %}
