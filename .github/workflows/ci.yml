name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Live portal tests are never enabled here: CI must not touch the real portal.
env:
  PYTHON_VERSION: "3.13"
  TEST_DATABASE_URL: mysql+aiomysql://root:ci-root-password@127.0.0.1:13306/opbg_bot_test

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Segreti e placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: bash scripts/secret_scan.sh
      - name: Placeholder scan
        run: bash scripts/placeholder_scan.sh

  quality:
    name: Formato, lint, tipi e test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: opbg_bot_test
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=40s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
      - name: Formatter
        run: ruff format --check app tests alembic scripts
      - name: Linter
        run: ruff check .
      - name: Type checker
        run: mypy app tests
      - name: Button audit
        run: python scripts/handler_audit.py
      - name: Test suite
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  image:
    name: Immagine Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: opbg-telegram-bot:ci
      - name: Compose configuration
        env:
          APP_SECRET_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          APP_ENCRYPTION_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          APP_BLIND_INDEX_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          PUBLIC_BASE_URL: https://ci.invalid
          TELEGRAM_BOT_TOKEN: "1:SYNTHETIC-TOKEN-NOT-A-REAL-BOT"
          TELEGRAM_BOT_USERNAME: ci_bot
          TELEGRAM_ADMIN_IDS: "1"
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
          APP_DOMAIN: ci.invalid
          ACME_EMAIL: ci@ci.invalid
        run: docker compose -f compose.yaml config >/dev/null
