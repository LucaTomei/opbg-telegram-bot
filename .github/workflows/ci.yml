name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push on the same ref cancels the run still in flight: there is a single
# self-hosted runner and a superseded run is wasted time on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrail e analisi del diff
    # Self-hosted runner on the Proxmox node. It takes one job at a time, so the
    # scans and the diff classification share a single checkout instead of
    # paying for two. The workspace survives between runs, hence the clean
    # checkout, and every job carries a timeout: a hung step must never pin the
    # only runner.
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      # Always run: a secret can be committed in any file, documentation
      # included, and the scans take seconds.
      - name: Secret scan
        run: bash scripts/secret_scan.sh
      - name: Placeholder scan
        run: bash scripts/placeholder_scan.sh

      - name: Classify the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          run_everything() {
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          # A manual run is an explicit request for the full pipeline, and a
          # missing base commit (a brand new branch, a force push) means the
          # diff cannot be trusted.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run_everything "manual run: everything"
          fi
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) run_everything "no usable base: everything" ;;
          esac
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            run_everything "base commit missing: everything"
          fi

          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Tests depend on the application, the migrations, the helper scripts
          # and the pinned dependencies. The workflow itself is in the list so a
          # change to CI is always exercised by CI.
          CODE='^(app/|tests/|alembic/|alembic\.ini$|scripts/|pyproject\.toml$|requirements(-dev)?\.lock$|\.github/workflows/)'
          # The image additionally depends on the build and Compose definitions.
          IMAGE='^(app/|alembic/|alembic\.ini$|scripts/|docker/|Dockerfile$|\.dockerignore$|compose(\.dev)?\.yaml$|pyproject\.toml$|requirements\.lock$|\.github/workflows/)'

          match() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }
          {
            echo "code=$(match "$CODE")"
            echo "image=$(match "$IMAGE")"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Formato, lint, tipi e test
    needs: guardrails
    if: needs.guardrails.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 30
    # The job runs inside the official image instead of installing Python on the
    # runner: the interpreter is then the same one the application is built on,
    # whatever the runner's own distribution is, and nothing is left behind on
    # the host.
    container:
      image: python:3.13
    env:
      # Inside a job container the service is reached by its name, not through a
      # port published on the host.
      TEST_DATABASE_URL: mysql+aiomysql://root:ci-root-password@mysql:3306/opbg_bot_test
      # The container runs as root while the runner that cleans the workspace
      # afterwards does not, so nothing the tools write may land in the
      # workspace: caches and bytecode go elsewhere.
      PYTHONDONTWRITEBYTECODE: "1"
      MYPY_CACHE_DIR: /tmp/mypy-cache
      RUFF_CACHE_DIR: /tmp/ruff-cache
      COVERAGE_FILE: /tmp/coverage-data
      PYTEST_ADDOPTS: -p no:cacheprovider
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: opbg_bot_test
        # Probed early and often: the job waits for this before its first step,
        # and MySQL is usually ready well before a lazier schedule notices.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true
      - uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-3.13-${{ hashFiles('requirements-dev.lock') }}
          restore-keys: pip-3.13-
      - name: Install dependencies
        # The lock file is complete, so resolution is pure overhead.
        run: pip install --no-deps --requirement requirements-dev.lock
      - name: Formatter
        run: ruff format --check app tests alembic scripts
      - name: Linter
        run: ruff check .
      - name: Type checker
        run: mypy app tests
      - name: Button audit
        run: python scripts/handler_audit.py
      - name: Test suite
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Hand the workspace back to the runner
        # Whatever ran as root here would otherwise be undeletable by the next
        # job: they share one directory on this runner. The parent directory
        # belongs to the runner account, so it is the reference to restore.
        if: always()
        run: chown -R --reference=.. . || true

  image:
    name: Immagine Docker
    needs: [guardrails, quality]
    # Runs when the image content changed, but never publishes an image whose
    # tests failed. `always()` is required because `quality` is skipped when the
    # change does not touch the code.
    if: >-
      always()
      && needs.guardrails.outputs.image == 'true'
      && needs.quality.result != 'failure'
      && needs.quality.result != 'cancelled'
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Lowercase: a registry rejects an image reference that is not, and the
      # GitHub account is spelled with capitals. Same default as compose.yaml.
      REGISTRY_IMAGE: ghcr.io/lucatomei/opbg-telegram-bot
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true
      - name: Build
        # Plain docker build, not buildx: the runner is self-hosted, so the
        # daemon's own layer cache survives between runs, while a fresh buildx
        # builder would start cold every time.
        run: docker build --tag opbg-telegram-bot:ci .
      - name: Compose configuration
        env:
          APP_SECRET_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          APP_ENCRYPTION_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          APP_BLIND_INDEX_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          TELEGRAM_BOT_TOKEN: "1:SYNTHETIC-TOKEN-NOT-A-REAL-BOT"
          TELEGRAM_BOT_USERNAME: ci_bot
          TELEGRAM_ADMIN_IDS: "1"
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: docker compose -f compose.yaml config >/dev/null
      - name: Publish to the registry
        # Only from main, and only after the tests. Deployments pull
        # ':latest'; ':sha-<commit>' pins a rollback to an exact commit.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "$SHA_TAG"; do
            docker tag opbg-telegram-bot:ci "${REGISTRY_IMAGE}:${tag}"
            docker push "${REGISTRY_IMAGE}:${tag}"
            docker image rm -f "${REGISTRY_IMAGE}:${tag}" || true
          done
          echo "published ${REGISTRY_IMAGE}:latest and :${SHA_TAG}"

      - name: Reclaim disk space
        # The runner keeps everything it builds, so the image produced here goes
        # away at the end of every run. The build cache is trimmed, not wiped:
        # the next run reuses it.
        if: always()
        run: |
          docker logout ghcr.io || true
          docker image rm -f opbg-telegram-bot:ci || true
          docker builder prune --force --keep-storage 4GB || true
