name: CI

on:
  push:
    branches: [main]
    # A version tag publishes the same image under its version number.
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild of main: the base image and the system packages receive
  # security fixes even when the code does not change.
  schedule:
    - cron: "17 4 * * 1"

# A new push on the same ref cancels the run still in flight: a superseded run
# is wasted time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrail e analisi del diff
    # The scans and the diff classification share a single checkout instead of
    # paying for two. Every job carries a timeout: a hung step must never burn
    # a runner for hours.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Always run: a secret can be committed in any file, documentation
      # included, and the scans take seconds.
      - name: Secret scan
        run: bash scripts/secret_scan.sh
      - name: Placeholder scan
        run: bash scripts/placeholder_scan.sh

      - name: Classify the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          run_everything() {
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          # A manual run is an explicit request for the full pipeline, and a
          # missing base commit (a brand new branch, a force push) means the
          # diff cannot be trusted.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run_everything "manual run: everything"
          fi
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) run_everything "no usable base: everything" ;;
          esac
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            run_everything "base commit missing: everything"
          fi

          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Tests depend on the application, the migrations, the helper scripts
          # and the pinned dependencies. The workflow itself is in the list so a
          # change to CI is always exercised by CI.
          CODE='^(app/|tests/|alembic/|alembic\.ini$|scripts/|pyproject\.toml$|requirements(-dev)?\.lock$|\.github/workflows/)'
          # The image additionally depends on the build and Compose definitions.
          IMAGE='^(app/|alembic/|alembic\.ini$|scripts/|docker/|Dockerfile$|\.dockerignore$|compose(\.dev)?\.yaml$|pyproject\.toml$|requirements\.lock$|\.github/workflows/)'

          match() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }
          {
            echo "code=$(match "$CODE")"
            echo "image=$(match "$IMAGE")"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Formato, lint, tipi e test
    needs: guardrails
    if: needs.guardrails.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The job runs inside the official image instead of installing Python on the
    # runner: the interpreter is then the same one the application is built on.
    container:
      image: python:3.13
    env:
      # Inside a job container the service is reached by its name, not through a
      # port published on the host.
      TEST_DATABASE_URL: mysql+aiomysql://root:ci-root-password@mysql:3306/opbg_bot_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: opbg_bot_test
        # Probed early and often: the job waits for this before its first step,
        # and MySQL is usually ready well before a lazier schedule notices.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: /root/.cache/pip
          key: pip-3.13-${{ hashFiles('requirements-dev.lock') }}
          restore-keys: pip-3.13-
      - name: Install dependencies
        # The lock file is complete, so resolution is pure overhead.
        run: pip install --no-deps --requirement requirements-dev.lock
      - name: Formatter
        run: ruff format --check app tests alembic scripts
      - name: Linter
        run: ruff check .
      - name: Type checker
        run: mypy app tests
      - name: Button audit
        run: python scripts/handler_audit.py
      - name: Test suite
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  image:
    name: Immagine Docker
    needs: [guardrails, quality]
    # On main the image must always match main. Filtering there leaves the
    # registry behind whenever a run fails and the fix touches only files the
    # image does not contain: the fix goes green, the image is skipped, and what
    # is published stays old. Pull requests keep the filter, and no run ever
    # publishes an image whose tests failed. `always()` is required because
    # `quality` is skipped when the change does not touch the code.
    if: >-
      always()
      && needs.quality.result != 'failure'
      && needs.quality.result != 'cancelled'
      && (needs.guardrails.outputs.image == 'true'
          || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Lowercase: a registry rejects an image reference that is not, and the
      # GitHub account is spelled with capitals. Same default as compose.yaml.
      REGISTRY_IMAGE: ghcr.io/lucatomei/opbg-telegram-bot
      # Everything except pull requests publishes: main pushes, the weekly
      # rebuild, manual runs on main and version tags.
      PUBLISH: >-
        ${{ github.event_name != 'pull_request'
            && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        # Retried because the base image comes from Docker Hub, which regularly
        # answers 500 while issuing the anonymous pull token. That is not a
        # fault of this repository and must not fail the run.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            # --pull: the weekly rebuild exists to pick up a newer base image.
            # The labels link the package to this repository on GitHub.
            if docker build --pull --tag opbg-telegram-bot:ci \
                --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --label "org.opencontainers.image.revision=${{ github.sha }}" \
                --label "org.opencontainers.image.version=${{ github.ref_name }}" \
                --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --label "org.opencontainers.image.licenses=MIT" \
                --label "org.opencontainers.image.title=opbg-telegram-bot" \
                --label "org.opencontainers.image.description=Telegram bot for the OPBG booking portal" \
                .; then
              exit 0
            fi
            echo "build attempt ${attempt} failed"
            [ "${attempt}" = "3" ] && break
            sleep $((attempt * 20))
          done
          exit 1
      - name: Compose configuration
        env:
          APP_SECRET_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          APP_ENCRYPTION_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          APP_BLIND_INDEX_KEY: ${{ secrets.CI_PLACEHOLDER_KEY || 'Q0lfT05MWV9EVU1NWV9LRVlfRk9SX0NPTkZJR19WQUxJRA' }}
          TELEGRAM_BOT_TOKEN: "1:SYNTHETIC-TOKEN-NOT-A-REAL-BOT"
          TELEGRAM_BOT_USERNAME: ci_bot
          TELEGRAM_ADMIN_IDS: "1"
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: docker compose -f compose.yaml config >/dev/null
      - name: Publish to the registry
        # Only after the tests. Deployments pull ':latest', which always
        # follows main; ':sha-<commit>' pins a rollback to an exact commit and
        # a version tag such as v1.2.3 also publishes ':1.2.3' and ':1.2'.
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAGS="sha-$(git rev-parse --short HEAD)"
          case "$REF" in
            refs/heads/main)
              TAGS="latest $TAGS"
              ;;
            refs/tags/v*)
              VERSION="${REF_NAME#v}"
              TAGS="$VERSION ${VERSION%.*} $TAGS"
              ;;
          esac
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in $TAGS; do
            docker tag opbg-telegram-bot:ci "${REGISTRY_IMAGE}:${tag}"
            docker push "${REGISTRY_IMAGE}:${tag}"
            echo "published ${REGISTRY_IMAGE}:${tag}"
          done
